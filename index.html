<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blink Math</title>
    <!-- index css -->
    <link rel="stylesheet" href="style.css" />

    <!-- Google apis -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind Css -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-indigo-50 absolute shadow-sm w-full top-0 z-50">
      <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-10">
        <div class="flex justify-between items-center h-20">
          <div class="flex items-center">
            <div
              class="logo text-3xl text-blue-300 cursor-pointer hover:text-purple-700 transition-all ml-3"
            >
              <a href="index.html">✨Blìnkmath</a>
            </div>
          </div>
          <a
            href="#"
            class="btn-primary text-white px-5 py-2 rounded-full text-sm font-medium"
          >
          Back Home
          </a>
        </div>
      </div>
    </nav>
    <!-- Hero section -->
    <section id="" class="gradient-bg py-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:">
        <div class="text-center mb-5">
          <h2 class="text-4xl font-bold text-white mt-20">
            Welcome To Blìnkmath
          </h2>
          <p class="text-xl text-purple-200 mt-3">Jangan Lupa Di Isi Yaa!!</p>
        </div>
        <div
          class="floating-animation bg-gray-50 max-w-2xl mx-auto rounded-2xl p-8 md:p-9 shadow-2xl"
        >
          <form action="" class="space-y-6">
            <div class="grid grid-cols-1 gap-6">
              <div>
                <label
                  for=""
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Name</label
                >
                <input
                  type="text"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                  placeholder="Your name...."
                />
              </div>
              <div>
                <label
                  for=""
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Password</label
                >
                <input
                  type="text"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                  placeholder="1234..."
                />
              </div>
              <div class="btn-login mx-auto p-7">
                <a
                  href="two.html"
                  class=" btn-primary text-white px-20 py-3 max-w-60 rounded-full text-center text-xl"
                  >Masuk</a
                >
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
