<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlinkMath</title>

    <!-- link style.css -->
    <link rel="stylesheet" href="style.css" />

    <!-- Tailwind Css -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="bg-indigo-100 absolute shadow-sm w-full top-0 z-50">
      <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-10">
        <div class="flex justify-between items-center h-20">
          <div class="flex items-center">
            <div
              class="logo-container text-2xl md:text-3xl text-blue-300 cursor-pointer hover:text-purple-700 transition-all ml-3"
            >
              <a href="index.html" id="page-logo">✨Blìnkmath</a>
            </div>
          </div>
          <a
            href="two.html"
            class="btn-primary text-white px-5 py-2 rounded-full text-sm font-medium"
          >
            Back Home
          </a>
        </div>
      </div>
    </nav>

    <!-- section -->
    <section class="bg-gradient-to-br from-blue-700 to-red-400 py-20 h-svh">
      <div class="max-w-7xl px-4 flex flex-nowrap items-center justify-between">
        <div
          class="flex gap-2 md:bg-gradient-to-br from-blue-700 to-red-400 rounded-xl md:mt-7 md:px-4"
        >
          <img
            src="/username-logo/user.jpg"
            alt=""
            srcset=""
            class="mt-2 md:h-10 h-8"
          />
          <p class="hidden text-white mt-4">Username</p>
        </div>
        <div class="flex gap-3 md:gap-7 md:mr-10 md:mt-8 mt-3">
          <h1
            class="md:text-md text-green-900 bg-green-200 border-2 px-2 py-1 border border-green-400 rounded-xl"
          >
            ✅️<span>0</span>
          </h1>
          <h1
            class="md:text-md text-red-900 bg-red-200 border-2 px-2 py-1 border border-red-400 rounded-xl"
          >
            ❌0
          </h1>
        </div>
      </div>
    </section>
  </body>
</html>
