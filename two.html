<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blink Math</title>

    <!-- index css -->
    <link rel="stylesheet" href="style.css" />

    <!-- Tailwind Css -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body class="">
    <!-- Navbar -->
    <nav class="bg-indigo-100 absolute shadow-sm w-full top-0 z-50">
      <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-10">
        <div class="flex justify-between items-center h-20">
          <div class="flex items-center">
            <div
              class="logo-container text-2xl md:text-3xl text-blue-300 cursor-pointer hover:text-purple-700 transition-all ml-3"
            >
              <a href="index.html" id="page-logo">✨Blìnkmath</a>
            </div>
          </div>
          <a
            href="two.html"
            class="btn-primary text-white px-5 py-2 rounded-full text-sm font-medium"
          >
            Back Home
          </a>
        </div>
      </div>
    </nav>

    <!-- section -->
    <section id="" class="bg-gradient-to-br from-blue-700 to-red-400 py-20">
      <div class="max-w-7xl px-4 flex flex-nowrap items-center justify-between">
        <div
          class="flex gap-2 md:bg-gradient-to-br from-blue-700 to-red-400 rounded-xl md:mt-7 md:px-4"
        >
          <img
            src="/username-logo/user.jpg"
            alt=""
            srcset=""
            class="mt-2 md:h-10 h-8"
          />
          <p class="hidden text-white mt-4">Username</p>
        </div>
        <div class="flex gap-3 md:gap-7 md:mr-10 md:mt-8 mt-3">
          <h1
            class="md:text-md text-green-900 bg-green-200 border-2 px-2 py-1 border border-green-400 rounded-xl"
          >
            ✅️<span>0</span>
          </h1>
          <h1
            class="md:text-md text-red-900 bg-red-200 border-2 px-2 py-1 border border-red-400 rounded-xl"
          >
            ❌0
          </h1>
        </div>
      </div>

      <div class="py-10">
        <div class="word text-center mb-5"></div>
        <div
          class="md:mb-20 md:max-w-3xl mx-auto rounded-2xl md:p-5 md:p-9 shadow-2xl"
        >
          <div class="m-5 medium md:text-xl text-center text-white">
            <p>
              Tes ini melatih mental dan skill Matematika anda. Jadi apalagi
              coba sekarang <b>"SAYA MAKSA😠"</b>
            </p>
          </div>

          <!-- bagian tools-->
          <form action="" class="space-y-6">
            <div class="gap-10 ml-10 text-white">
              <div class="md:grid grid-cols-2 grid-rows-1 py-10 px-10">
                <div class="mb-10">
                  <h1 class="">⚡Kecepatan</h1>
                  <input
                    type="number"
                    class="text-black bg-gray-50 border border-gray-900 rounded-2xl px-8 focus:ring-2 focus:ring-blue-500 focus:ring-blue-500"
                  />
                  <div class="flex gap-40">
                    <p class="opacity-25 ml-2 text-sm font-thin">cepat</p>
                    <p class="opacity-25 ml-2 text-sm font-thin">lambat</p>
                  </div>
                </div>
                <div>
                  <h1 class="ml-3"># Number Count</h1>
                  <input
                    type="number"
                    class="text-black bg-gray-50 border border-gray-900 rounded-2xl px-8 focus:ring-2 focus:ring-blue-500 focus:ring-blue-500"
                  />
                </div>
                <div>
                  <h1 class="ml-3">Minimum Angka</h1>
                  <input
                    type="number"
                    class="text-black bg-gray-50 border border-gray-900 rounded-2xl px-8 focus:ring-2 focus:ring-blue-500 focus:ring-blue-500"
                  />
                </div>
                <div class="mb-10">
                  <h1 class="ml-3">Maximum Angka</h1>
                  <input
                    type="number"
                    class="text-black bg-gray-50 border border-gray-900 rounded-2xl px-8 focus:ring-2 focus:ring-blue-500 focus:ring-blue-500"
                  />
                </div>
                <div class="mt-5">
                  <h1 class="ml-3">Masukkan +-*/</h1>
                  <input
                    type="text"
                    class="text-black bg-gray-50 border border-gray-900 rounded-2xl px-8 focus:ring-2 focus:ring-blue-500 focus:ring-blue-500"
                  />
                </div>
              </div>
              <div class="text-center mt-10">
                <a href="Three.html" class="bg-red-300 py-4 px-20  text-xl font-medium rounded-lg " >Mulai Sekarang</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
